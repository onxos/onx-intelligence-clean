name: ONX Production Release

# ONX-FRR-2026-001 — the ONE governed path to Render production for this
# repository. Same contract as onxos/onx onx-platform-production-release:
# exact-SHA deploy, service-identity fail-close (including AUTODEPLOY hold),
# pinned rollback that must equal the currently-live SHA, 15-minute monitored
# health, durable lease, sanitized evidence artifact. The engine is vendored
# from onxos/onx (scripts/release-gate/, provenance header inside) and is
# offline-tested in this run before it may touch Render.

on:
  workflow_dispatch:
    inputs:
      service:
        description: Registered service to release
        required: true
        type: choice
        options:
          - onx-intelligence-clean
      target_sha:
        description: Exact 40-hex commit SHA to deploy (must be on main)
        required: true
        type: string
      rollback_sha:
        description: Exact 40-hex SHA currently live before this release
        required: true
        type: string
      confirm:
        description: Type RELEASE_ONX_INTELLIGENCE_EXACT_SHA
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: onx-release-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.service }} at exact SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: production-release
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      TARGET_SHA: ${{ inputs.target_sha }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
      SERVICE: ${{ inputs.service }}
      CONFIRM: ${{ inputs.confirm }}
      REPORT_PATH: docs/runtime-attestations/release-${{ inputs.service }}.json
      PLATFORM_RELEASE_CONTROL_REF: onx-ops-control
      PLATFORM_RELEASE_CONTROL_PATH: leases/${{ inputs.service }}-release-current.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Validate explicit release inputs
        run: |
          set -euo pipefail
          TARGET="$(echo "$TARGET_SHA" | tr 'A-F' 'a-f')"
          ROLLBACK="$(echo "$ROLLBACK_SHA" | tr 'A-F' 'a-f')"
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROLLBACK" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRM" = "RELEASE_ONX_INTELLIGENCE_EXACT_SHA"
          test "$TARGET" != "$ROLLBACK"
          test "$(git rev-parse HEAD)" = "$TARGET"
          git fetch origin main --quiet
          git merge-base --is-ancestor "$TARGET" origin/main
          echo "TARGET_SHA=$TARGET" >> "$GITHUB_ENV"
          echo "ROLLBACK_SHA=$ROLLBACK" >> "$GITHUB_ENV"

      - name: Prove required CI green on the exact target SHA
        uses: actions/github-script@v7
        with:
          script: |
            const target = process.env.TARGET_SHA;
            const required = JSON.parse(
              require("node:fs").readFileSync("deploy-registry.json", "utf8"),
            ).requiredCiWorkflows;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: target,
              per_page: 100,
            });
            const failures = [];
            for (const name of required) {
              const run = data.workflow_runs
                .filter((r) => r.name === name)
                .sort((a, b) => b.run_attempt - a.run_attempt)[0];
              if (!run || run.status !== "completed" || run.conclusion !== "success") {
                failures.push(name);
              }
            }
            if (failures.length) {
              core.setFailed(`CI_GATES_NOT_PROVEN:${failures.join(",")}`);
              return;
            }
            core.exportVariable("CI_PROOF_SHA", target);

      - name: Resolve the registered release target
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const registry = JSON.parse(readFileSync("deploy-registry.json", "utf8"));
          const entry = registry.services.find(
            (s) => s.name === process.env.SERVICE,
          );
          if (!entry?.release) {
            throw new Error(`service ${process.env.SERVICE} has no release contract in deploy-registry.json`);
          }
          const target = {
            serviceId: entry.renderServiceId,
            name: entry.name,
            ...entry.release,
          };
          for (const key of ["serviceId", "name", "repository", "branch", "rootDir"]) {
            if (!target[key]) throw new Error(`release contract missing ${key}`);
          }
          appendFileSync(
            process.env.GITHUB_ENV,
            `RELEASE_TARGET_JSON=${JSON.stringify(target)}\n`,
          );
          NODE

      - name: Verify release and rollback logic offline
        run: node --test scripts/release-gate/production-release.test.mjs

      - name: Release, prove, monitor 15 minutes, or rollback
        run: node scripts/release-gate/production-release.mjs

      - name: Upload sanitized release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onx-release-${{ inputs.service }}-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90
