name: blueprint-guard

# ONX-FRR-2026-001 — render.yaml may only declare Render resources registered
# in deploy-registry.json (the repo-local slice of onxos/onx:onx-routing.json).
# Read-only check; no Render API calls, no secrets.

on:
  push:
    branches: [main]
    paths:
      - render.yaml
      - deploy-registry.json
      - scripts/blueprint-guard.mjs
      - .github/workflows/blueprint-guard.yml
  pull_request:
    paths:
      - render.yaml
      - deploy-registry.json
      - scripts/blueprint-guard.mjs
      - .github/workflows/blueprint-guard.yml

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Blueprint guard
        run: node scripts/blueprint-guard.mjs
