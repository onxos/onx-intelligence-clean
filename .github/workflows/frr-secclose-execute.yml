name: FRR security-close execute (guarded, self-reverting)

# ONX-FRR-2026-001 — closes the internet-open onx_intelligence DB safely.
#
# Founder order: "اغلقاه واحميني واحمي المشروع لاتقبل الغلط او المخاطرة".
# The health check is NOT a reliable rollback gate (dbReady returns HTTP 200 even
# when the DB is down), so this does NOT trust Render's gate — it verifies the
# JSON `ready:true` field itself and AUTO-REVERTS on any failure. The allow-list
# is emptied ONLY after internal connectivity is proven. Every failure path
# restores production to its exact pre-change state (external DB URL, allow-list
# untouched) — no path can leave production broken or the DB connection cut.
#
# No secret value (DB URL) is ever printed — only classifications/booleans.

on:
  push:
    branches:
      - claude/render-audit-review-n90nx0
    paths:
      - .github/workflows/frr-secclose-execute.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secclose:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      BASE: https://onx-intelligence-clean.onrender.com
    steps:
      - name: Switch to internal host (verified), then close external access
        run: |
          node --input-type=module <<'NODE'
          const KEY = process.env.RENDER_API_KEY;
          const BASE = process.env.BASE;
          const H = { Accept: "application/json", Authorization: `Bearer ${KEY}` };
          const api = async (method, p, body) => {
            const r = await fetch("https://api.render.com/v1" + p, {
              method,
              headers: { ...H, ...(body ? { "Content-Type": "application/json" } : {}) },
              ...(body ? { body: JSON.stringify(body) } : {}),
              signal: AbortSignal.timeout(30000),
            });
            let j = null; try { j = await r.json(); } catch {}
            return { ok: r.ok, status: r.status, j };
          };
          const unwrap = (v, k) => (v && typeof v === "object" ? v[k] ?? v : v);
          const sleep = (ms) => new Promise((res) => setTimeout(res, ms));

          const SERVICE_ID = "srv-d8vkfs5aeets73d5gkcg"; // onx-intelligence-clean
          const DB_ID = "dpg-d8tns09kh4rs73fhkdlg-a";     // onx_intelligence

          // read health.dbReady JSON — returns {ready, backend} or null on transport error
          const readHealth = async () => {
            try {
              const r = await fetch(BASE + "/api/trpc/health.dbReady", { signal: AbortSignal.timeout(30000) });
              const t = await r.text();
              const m = JSON.parse(t)?.result?.data?.json ?? {};
              return { http: r.status, ready: m.ready === true, backend: m.backend, state: m.state };
            } catch (e) { return { http: 0, ready: false, backend: "?", state: "TRANSPORT_ERROR" }; }
          };
          const waitReady = async (attempts, gapMs) => {
            for (let i = 0; i < attempts; i++) {
              const h = await readHealth();
              console.log(`   health.dbReady: http=${h.http} ready=${h.ready} backend=${h.backend} state=${h.state}`);
              if (h.ready) return true;
              await sleep(gapMs);
            }
            return false;
          };
          const setDbUrl = (value) => api("PUT", `/services/${SERVICE_ID}/env-vars/DATABASE_URL`, { value });
          const triggerDeploy = async () => {
            const d = await api("POST", `/services/${SERVICE_ID}/deploys`, {});
            const id = unwrap(d.j, "deploy")?.id ?? d.j?.id;
            return id;
          };
          const FAIL_STATES = new Set(["build_failed","update_failed","canceled","pre_deploy_failed","deactivated"]);
          const waitDeployLive = async (deployId, maxIters) => {
            for (let i = 0; i < maxIters; i++) {
              const d = unwrap((await api("GET", `/services/${SERVICE_ID}/deploys/${deployId}`)).j, "deploy");
              const st = d?.status ?? "?";
              if (i % 2 === 0) console.log(`   deploy ${String(deployId).slice(0,10)} status=${st}`);
              if (st === "live") return "live";
              if (FAIL_STATES.has(st)) return st;
              await sleep(15000);
            }
            return "timeout";
          };

          console.log("=".repeat(64));
          console.log("SECURITY-CLOSE EXECUTE — guarded, self-reverting");
          console.log("=".repeat(64));

          // ---- STAGE 0: preconditions (no mutation) ----
          const ci = await api("GET", `/postgres/${DB_ID}/connection-info`);
          const INT_URL = ci.j?.internalConnectionString || ci.j?.internalConnectionUrl || "";
          if (!INT_URL) { console.error("::error::no internal connection string; aborting (no mutation)"); process.exit(1); }

          const envRes = (await api("GET", `/services/${SERVICE_ID}/env-vars`)).j;
          const envRows = Array.isArray(envRes) ? envRes.map((e) => unwrap(e, "envVar")) : [];
          const EXT_URL = envRows.find((e) => e.key === "DATABASE_URL")?.value ?? "";
          if (!EXT_URL) { console.error("::error::DATABASE_URL not found on service; aborting"); process.exit(1); }
          const currentlyExternal = /\.render\.com/.test(EXT_URL.replace(/^[^@]*@?/, ""));
          const internalDiffers = INT_URL !== EXT_URL;
          console.log(`[0] current DATABASE_URL host   : ${currentlyExternal ? "EXTERNAL" : "INTERNAL"}`);
          console.log(`[0] internal string differs     : ${internalDiffers}`);
          if (!currentlyExternal) { console.log("Already on internal host — skipping switch, going straight to close check."); }

          const dbBefore = unwrap((await api("GET", `/postgres/${DB_ID}`)).j, "postgres");
          const allowBefore = (dbBefore.ipAllowList ?? []).map((a) => a.cidrBlock || a);
          console.log(`[0] ipAllowList before          : ${JSON.stringify(allowBefore)}`);
          if (allowBefore.length === 0) { console.log("Allow-list already empty (internal-only). Nothing to close. Exiting success."); process.exit(0); }

          const base = await readHealth();
          console.log(`[0] baseline health.dbReady     : ready=${base.ready} backend=${base.backend}`);
          if (!base.ready) { console.error("::error::baseline health not ready — refuse to mutate an already-unhealthy service"); process.exit(1); }

          // ---- STAGE 1: switch to internal (only if currently external) ----
          const revertToExternal = async (why) => {
            console.log(`\n!! REVERTING — ${why}`);
            await setDbUrl(EXT_URL);
            const rid = await triggerDeploy();
            const rst = await waitDeployLive(rid, 48);
            const rok = await waitReady(6, 5000);
            console.log(`   revert deploy status=${rst}  health-restored=${rok}`);
            console.log("   allow-list left UNCHANGED (still open) — exposure identical to pre-run; NO new breakage.");
          };

          if (currentlyExternal && internalDiffers) {
            console.log("\n[1] switching DATABASE_URL -> internal host, deploying...");
            const put = await setDbUrl(INT_URL);
            if (!put.ok) { console.error(`::error::env PUT failed ${put.status}; no deploy triggered; aborting`); process.exit(1); }
            const depId = await triggerDeploy();
            if (!depId) { console.error("::error::could not trigger deploy; reverting env"); await setDbUrl(EXT_URL); process.exit(1); }
            const st = await waitDeployLive(depId, 48);
            console.log(`[1] switch deploy final status  : ${st}`);
            if (st !== "live") { await revertToExternal(`switch deploy did not go live (status=${st})`); process.exit(1); }

            // ---- STAGE 2: verify internal connectivity via JSON ready:true ----
            console.log("\n[2] verifying internal DB connectivity (JSON ready:true)...");
            const ok = await waitReady(8, 5000);
            if (!ok) { await revertToExternal("internal host NOT reachable (ready never became true)"); process.exit(1); }
            console.log("[2] internal host CONFIRMED working (ready:true).");
          }

          // ---- STAGE 3: close external access (allow-list -> []) ----
          console.log("\n[3] closing external access (ipAllowList -> [])...");
          const patch = await api("PATCH", `/postgres/${DB_ID}`, { ipAllowList: [] });
          if (!patch.ok) { console.error(`::error::allow-list PATCH failed ${patch.status}`); await revertToExternal("allow-list close failed after switch"); process.exit(1); }
          const dbAfter = unwrap((await api("GET", `/postgres/${DB_ID}`)).j, "postgres");
          const allowAfter = (dbAfter.ipAllowList ?? []).map((a) => a.cidrBlock || a);
          console.log(`[3] ipAllowList after           : ${JSON.stringify(allowAfter)}`);

          // ---- STAGE 4: confirm still healthy on internal after close ----
          console.log("\n[4] confirming health after close (internal must be unaffected)...");
          const stillOk = await waitReady(6, 5000);
          if (!stillOk || allowAfter.length !== 0) {
            console.error("::error::post-close health failed or allow-list not empty — reverting allow-list AND env");
            await api("PATCH", `/postgres/${DB_ID}`, { ipAllowList: [{ cidrBlock: "0.0.0.0/0", description: "revert" }] });
            await revertToExternal("post-close verification failed");
            process.exit(1);
          }

          console.log("\n" + "=".repeat(64));
          console.log("SUCCESS — onx_intelligence is now INTERNAL-ONLY (allow-list empty),");
          console.log("matching onx-platform-db / onx-marketing-db. The leaked credential is");
          console.log("no longer reachable from the public internet. Health ready:true on internal.");
          console.log("Reversible: re-add 0.0.0.0/0 to restore. Credential rotation still advised.");
          console.log("=".repeat(64));
          NODE
