name: sync-bridge-secret
on: workflow_dispatch
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync BRIDGE_SHARED_SECRET from Render (marketing-api) into this repo's GitHub secret — server-side, never logged
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GH_TOKEN: ${{ secrets.OPS_GH_TOKEN }}
        run: |
          pip install -q pynacl && python3 - <<'PY'
          import json, os, urllib.request, base64
          if not os.environ.get("GH_TOKEN"): raise SystemExit("OPS_GH_TOKEN secret missing on this repo")
          RK=os.environ["RENDER_API_KEY"]; GH=os.environ["GH_TOKEN"]
          env=json.load(urllib.request.urlopen(urllib.request.Request("https://api.render.com/v1/services/srv-d98v103eo5us73fqim60/env-vars?limit=50",headers={"Authorization":"Bearer "+RK}),timeout=60))
          sec=[e["envVar"]["value"] for e in env if e["envVar"]["key"]=="BRIDGE_SHARED_SECRET"][0]
          H={"Authorization":"token "+GH,"Accept":"application/vnd.github+json"}
          pk=json.load(urllib.request.urlopen(urllib.request.Request("https://api.github.com/repos/onxos/onx-intelligence-clean/actions/secrets/public-key",headers=H),timeout=60))
          from nacl import public, encoding
          box=public.SealedBox(public.PublicKey(pk["key"].encode(), encoding.Base64Encoder))
          enc=base64.b64encode(box.encrypt(sec.encode())).decode()
          body=json.dumps({"encrypted_value":enc,"key_id":pk["key_id"]}).encode()
          r=urllib.request.Request("https://api.github.com/repos/onxos/onx-intelligence-clean/actions/secrets/BRIDGE_SHARED_SECRET",data=body,headers=H,method="PUT")
          print("secret sync:", urllib.request.urlopen(r,timeout=60).status)
          PY
