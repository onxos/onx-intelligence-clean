name: agents-liveness-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Bridge call to agentRuntime.status (key fetched server-to-server, never logged)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          KEY=os.environ["RENDER_API_KEY"]; H={"Authorization":"Bearer "+KEY}
          env=json.load(urllib.request.urlopen(urllib.request.Request("https://api.render.com/v1/services/srv-d98v103eo5us73fqim60/env-vars?limit=50",headers=H),timeout=60))
          sec=[e["envVar"]["value"] for e in env if e["envVar"]["key"]=="BRIDGE_SHARED_SECRET"][0]
          req=urllib.request.Request("https://onx-intelligence-clean.onrender.com/api/trpc/agentRuntime.status?batch=1&input=%7B%7D",
              headers={"x-onx-bridge-key": sec})
          d=json.load(urllib.request.urlopen(req,timeout=60))
          j=d[0].get("result",{}).get("data",{}).get("json",{})
          print("KEYS:", sorted(j.keys()) if isinstance(j,dict) else type(j))
          print("LIVENESS:", json.dumps(j)[:800])
          req2=urllib.request.Request("https://onx-intelligence-clean.onrender.com/api/trpc/agentRuntime.tasks?batch=1&input=%7B%7D",
              headers={"x-onx-bridge-key": sec})
          d2=json.load(urllib.request.urlopen(req2,timeout=60))
          print("TASKS:", json.dumps(d2[0].get("result",{}).get("data",{}).get("json",{}))[:500])
          PY
