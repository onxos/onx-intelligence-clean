name: FRR runtime probe (read-only)

# ONX-FRR-2026-001 — resolves the single runtime unknown in GAP-001: does the
# live intelligence service's legacy MySQL2/planetscale DB layer actually work
# against its PostgreSQL database?
#
# STRICTLY READ-ONLY. Every call is an HTTP GET to the PUBLIC service URL. No
# secrets are used, no database is connected from here, no tRPC mutation is
# ever called — only .query procedures. This cannot change any state.
#
# Runs on push to the FRR branch (no dependency on main) whenever this file
# changes, and on manual dispatch.

on:
  push:
    branches:
      - claude/render-audit-review-n90nx0
    paths:
      - .github/workflows/frr-runtime-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe live intelligence endpoints (getDb / MySQL path)
    runs-on: ubuntu-latest
    env:
      BASE: https://onx-intelligence-clean.onrender.com
    steps:
      - name: Probe read-only query endpoints and record HTTP status
        run: |
          set +e
          pass=0; broken=0
          probe () {
            local label="$1"; local path="$2"
            local body status
            body="$(curl -s -m 30 -o /tmp/body -w '%{http_code}' "$BASE$path")"
            status="$body"
            local head
            head="$(head -c 240 /tmp/body | tr '\n' ' ')"
            echo "── $label"
            echo "   GET $path"
            echo "   HTTP $status"
            echo "   body: $head"
            echo
            if [ "$status" = "200" ]; then
              pass=$((pass+1))
            else
              broken=$((broken+1))
            fi
          }

          echo "=============================================================="
          echo "FRR RUNTIME PROBE — $BASE"
          echo "read-only; public GET only; no secrets; no mutations"
          echo "=============================================================="
          echo

          echo "### baseline (non-DB) ###"
          probe "health.ping"     "/api/trpc/health.ping"

          echo "### pg path (real runtime) ###"
          probe "health.dbReady"  "/api/trpc/health.dbReady"

          echo "### MySQL getDb() path — the GAP-001 question ###"
          probe "intelligence.stats"      "/api/trpc/intelligence.stats"
          probe "intelligence.governance" "/api/trpc/intelligence.governance"
          probe "intelligence.continuity" "/api/trpc/intelligence.continuity"
          probe "intelligence.list"       "/api/trpc/intelligence.list"

          echo "=============================================================="
          echo "SUMMARY  pass(200)=$pass  non-200=$broken"
          echo
          echo "Interpretation:"
          echo "  If health.* is 200 but the intelligence.* (getDb) calls are 5xx,"
          echo "  the MySQL2/planetscale layer is broken against the live Postgres"
          echo "  DB — GAP-001 fix = retire the dead MySQL layer."
          echo "  If the intelligence.* calls are 200, DATABASE_URL is actually"
          echo "  MySQL and the fix direction reverses."
          echo "=============================================================="
