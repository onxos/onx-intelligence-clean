name: FRR onx-db close (guarded, self-reverting)

# ONX-FRR-2026-001 — closes the internet-open onx-db (the 4th DB, confirmed
# foundational by the founder) to INTERNAL-ONLY while preserving full project
# access. Consumers: onx-api + onx-api-l7bt (already INTERNAL — untouched;
# internal connections are not gated by ipAllowList) and onx-intelligence-staging
# (EXTERNAL — switched to internal first, verified, before the close).
#
# Same self-reverting guarantee as the onx_intelligence close: verifies JSON
# ready:true (not just HTTP 200), and every failure path restores staging's
# external URL and leaves the allow-list as it was. No secret value is printed.

on:
  push:
    branches:
      - claude/render-audit-review-n90nx0
    paths:
      - .github/workflows/frr-onxdb-close.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onxdbclose:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Switch staging to internal (verified), then close onx-db external access
        run: |
          node --input-type=module <<'NODE'
          const KEY = process.env.RENDER_API_KEY;
          const H = { Accept: "application/json", Authorization: `Bearer ${KEY}` };
          const api = async (method, p, body) => {
            const r = await fetch("https://api.render.com/v1" + p, {
              method,
              headers: { ...H, ...(body ? { "Content-Type": "application/json" } : {}) },
              ...(body ? { body: JSON.stringify(body) } : {}),
              signal: AbortSignal.timeout(30000),
            });
            let j = null; try { j = await r.json(); } catch {}
            return { ok: r.ok, status: r.status, j };
          };
          const unwrap = (v, k) => (v && typeof v === "object" ? v[k] ?? v : v);
          const sleep = (ms) => new Promise((res) => setTimeout(res, ms));

          const DB_ID = "dpg-d86s3uog4nts73b9j4sg-a";       // onx-db
          const STAGING_ID = "srv-d9dpmvbrjlhs73b49080";    // onx-intelligence-staging (external consumer)

          // resolve staging public URL from the API (don't assume)
          const svc = unwrap((await api("GET", `/services/${STAGING_ID}`)).j, "service");
          const STAGE_URL = (svc?.serviceDetails?.url || svc?.serviceDetails?.externalUrl || "").replace(/\/$/, "");
          console.log(`staging service: ${svc?.name ?? "?"}  url=${STAGE_URL || "(none)"}`);

          const readHealth = async () => {
            if (!STAGE_URL) return { http: 0, ready: false, backend: "?", state: "NO_URL" };
            try {
              const r = await fetch(STAGE_URL + "/api/trpc/health.dbReady", { signal: AbortSignal.timeout(30000) });
              const t = await r.text();
              const m = JSON.parse(t)?.result?.data?.json ?? {};
              return { http: r.status, ready: m.ready === true, backend: m.backend, state: m.state };
            } catch (e) { return { http: 0, ready: false, backend: "?", state: "TRANSPORT_ERROR" }; }
          };
          const waitReady = async (attempts, gapMs) => {
            for (let i = 0; i < attempts; i++) {
              const h = await readHealth();
              console.log(`   staging health.dbReady: http=${h.http} ready=${h.ready} backend=${h.backend} state=${h.state}`);
              if (h.ready) return true;
              await sleep(gapMs);
            }
            return false;
          };
          const setDbUrl = (value) => api("PUT", `/services/${STAGING_ID}/env-vars/DATABASE_URL`, { value });
          const triggerDeploy = async () => {
            const d = await api("POST", `/services/${STAGING_ID}/deploys`, {});
            return unwrap(d.j, "deploy")?.id ?? d.j?.id;
          };
          const FAIL_STATES = new Set(["build_failed","update_failed","canceled","pre_deploy_failed","deactivated"]);
          const waitDeployLive = async (deployId, maxIters) => {
            for (let i = 0; i < maxIters; i++) {
              const d = unwrap((await api("GET", `/services/${STAGING_ID}/deploys/${deployId}`)).j, "deploy");
              const st = d?.status ?? "?";
              if (i % 2 === 0) console.log(`   staging deploy ${String(deployId).slice(0,10)} status=${st}`);
              if (st === "live") return "live";
              if (FAIL_STATES.has(st)) return st;
              await sleep(15000);
            }
            return "timeout";
          };

          console.log("=".repeat(64));
          console.log("onx-db CLOSE — guarded, self-reverting");
          console.log("=".repeat(64));

          // ---- STAGE 0: preconditions ----
          const ci = await api("GET", `/postgres/${DB_ID}/connection-info`);
          const INT_URL = ci.j?.internalConnectionString || ci.j?.internalConnectionUrl || "";
          if (!INT_URL) { console.error("::error::no internal connection string for onx-db; aborting"); process.exit(1); }

          const envRes = (await api("GET", `/services/${STAGING_ID}/env-vars`)).j;
          const envRows = Array.isArray(envRes) ? envRes.map((e) => unwrap(e, "envVar")) : [];
          const EXT_URL = envRows.find((e) => e.key === "DATABASE_URL")?.value ?? "";
          if (!EXT_URL) { console.error("::error::staging DATABASE_URL not found; aborting"); process.exit(1); }
          const stagingExternal = /\.render\.com/.test(EXT_URL.replace(/^[^@]*@?/, ""));
          console.log(`[0] staging DATABASE_URL host   : ${stagingExternal ? "EXTERNAL" : "INTERNAL"}`);

          const dbBefore = unwrap((await api("GET", `/postgres/${DB_ID}`)).j, "postgres");
          const allowBefore = (dbBefore.ipAllowList ?? []).map((a) => a.cidrBlock || a);
          console.log(`[0] onx-db ipAllowList before   : ${JSON.stringify(allowBefore)}`);
          if (allowBefore.length === 0) { console.log("Already internal-only. Nothing to close. Exiting success."); process.exit(0); }

          const base = await readHealth();
          console.log(`[0] staging baseline ready      : ${base.ready}`);
          if (!base.ready) { console.error("::error::staging baseline not ready — refuse to mutate an already-unhealthy consumer"); process.exit(1); }

          const revert = async (why) => {
            console.log(`\n!! REVERTING — ${why}`);
            await setDbUrl(EXT_URL);
            const rid = await triggerDeploy();
            const rst = await waitDeployLive(rid, 48);
            const rok = await waitReady(6, 5000);
            console.log(`   revert deploy status=${rst}  staging-restored=${rok}`);
            console.log("   onx-db allow-list left UNCHANGED — exposure identical to pre-run; NO new breakage.");
          };

          // ---- STAGE 1: switch staging to internal ----
          if (stagingExternal && INT_URL !== EXT_URL) {
            console.log("\n[1] switching staging DATABASE_URL -> onx-db internal host, deploying...");
            const put = await setDbUrl(INT_URL);
            if (!put.ok) { console.error(`::error::env PUT failed ${put.status}; aborting (no deploy)`); process.exit(1); }
            const depId = await triggerDeploy();
            if (!depId) { console.error("::error::deploy trigger failed; reverting env"); await setDbUrl(EXT_URL); process.exit(1); }
            const st = await waitDeployLive(depId, 48);
            console.log(`[1] staging switch deploy status: ${st}`);
            if (st !== "live") { await revert(`staging deploy did not go live (status=${st})`); process.exit(1); }

            // ---- STAGE 2: verify staging on internal ----
            console.log("\n[2] verifying staging on internal (ready:true)...");
            if (!(await waitReady(8, 5000))) { await revert("staging NOT reachable on internal host"); process.exit(1); }
            console.log("[2] staging CONFIRMED working on internal.");
          } else {
            console.log("[1] staging already internal — no switch needed.");
          }

          // ---- STAGE 3: close onx-db external access ----
          console.log("\n[3] closing onx-db external access (ipAllowList -> [])...");
          const patch = await api("PATCH", `/postgres/${DB_ID}`, { ipAllowList: [] });
          if (!patch.ok) { console.error(`::error::allow-list PATCH failed ${patch.status}`); await revert("allow-list close failed"); process.exit(1); }
          const dbAfter = unwrap((await api("GET", `/postgres/${DB_ID}`)).j, "postgres");
          const allowAfter = (dbAfter.ipAllowList ?? []).map((a) => a.cidrBlock || a);
          console.log(`[3] onx-db ipAllowList after    : ${JSON.stringify(allowAfter)}`);

          // ---- STAGE 4: confirm staging still healthy (onx-api ×2 are internal => unaffected by design) ----
          console.log("\n[4] confirming staging health after close...");
          const stillOk = await waitReady(6, 5000);
          if (!stillOk || allowAfter.length !== 0) {
            console.error("::error::post-close verification failed — reverting allow-list AND staging env");
            await api("PATCH", `/postgres/${DB_ID}`, { ipAllowList: [{ cidrBlock: "0.0.0.0/0", description: "revert" }] });
            await revert("post-close verification failed");
            process.exit(1);
          }

          console.log("\n" + "=".repeat(64));
          console.log("SUCCESS — onx-db is now INTERNAL-ONLY (allow-list empty).");
          console.log("Project access preserved: onx-api / onx-api-l7bt (internal, untouched) and");
          console.log("onx-intelligence-staging (now internal, verified ready:true). No public-internet");
          console.log("path remains. Reversible: re-add 0.0.0.0/0 to restore.");
          console.log("=".repeat(64));
          NODE
